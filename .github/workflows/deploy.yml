name: "Full deployment — all infrastructure in one account"

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: "Type 'destroy' to tear down all infrastructure"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "api/lambda/**"
      - "api/terraform/**"
      - "api/frontend/**"
      - "compute/sast-scanner/**"
      - "compute/pentest-scanner/**"
      - "compute/terraform/**"

env:
  AWS_REGION:  us-east-1
  TF_VERSION:  "1.7.0"

jobs:

  # ── Step 1: Build lambda zip ───────────────────────────────────────────────
  build-lambda:
    name: "1 — Build Lambda zip"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build zip
        run: |
          mkdir -p api/lambda/package
          pip install psycopg2-binary==2.9.9 boto3==1.34.0 \
            --target api/lambda/package --quiet
          cp api/lambda/handler.py        api/lambda/package/
          cp api/lambda/status_updater.py api/lambda/package/
          cd api/lambda/package
          zip -r ../lambda_function.zip . -q
          cd ../../..
          ls -lh api/lambda/lambda_function.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: api/lambda/lambda_function.zip
          retention-days: 1

  # ── Step 2: API terraform ──────────────────────────────────────────────────
  api-terraform:
    name: "2 — API layer"
    runs-on: ubuntu-latest
    needs: build-lambda
    defaults:
      run:
        working-directory: api/terraform
    outputs:
      rds_endpoint:   ${{ steps.out.outputs.rds_endpoint }}
      rds_sg_id:      ${{ steps.out.outputs.rds_sg_id }}
      s3_bucket_name: ${{ steps.out.outputs.s3_bucket_name }}
      s3_bucket_arn:  ${{ steps.out.outputs.s3_bucket_arn }}
      api_url:        ${{ steps.out.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          path: api/lambda/

      - name: Write api/terraform/terraform.tfvars
        run: |
          cat > terraform.tfvars << EOF
          aws_region        = "us-east-1"
          account_id        = "${{ secrets.AWS_ACCOUNT_ID }}"
          vpc_id            = "${{ secrets.VPC_ID }}"
          private_subnet_a  = "${{ secrets.PRIVATE_SUBNET_A }}"
          private_subnet_b  = "${{ secrets.PRIVATE_SUBNET_B }}"
          public_subnet     = "${{ secrets.PUBLIC_SUBNET }}"
          lambda_role_arn   = "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/LabRole"
          lambda_sg_id      = "${{ secrets.LAMBDA_SG_ID }}"
          rds_sg_id         = "${{ secrets.RDS_SG_ID }}"
          sqs_queue_url     = "${{ secrets.SQS_QUEUE_URL }}"
          sqs_queue_arn     = "${{ secrets.SQS_QUEUE_ARN }}"
          state_machine_arn = "${{ secrets.STATE_MACHINE_ARN }}"
          db_password       = "${{ secrets.DB_PASSWORD }}"
          s3_bucket_name    = "cev-reports-${{ secrets.AWS_ACCOUNT_ID }}"
          EOF

      - name: Debug tfvars
        run: |
          echo "=== tfvars contents (secrets masked) ==="
          grep -v "password\|db_pass" terraform.tfvars
          echo "=== checking lambda_sg_id and rds_sg_id ==="
          grep "lambda_sg_id\|rds_sg_id" terraform.tfvars

      - run: terraform init

      - name: Import existing resources into state
        run: |
          # Import RDS subnet group if it exists
          aws rds describe-db-subnet-groups \
            --db-subnet-group-name cev-rds-subnet-group \
            --region us-east-1 > /dev/null 2>&1 && \
            terraform import aws_db_subnet_group.cev cev-rds-subnet-group || \
            echo "RDS subnet group not found, will create"

          # Import S3 bucket if it exists
          aws s3api head-bucket \
            --bucket cev-reports-${{ secrets.AWS_ACCOUNT_ID }} 2>/dev/null && \
            terraform import aws_s3_bucket.cev_reports \
              cev-reports-${{ secrets.AWS_ACCOUNT_ID }} || \
            echo "S3 bucket not found, will create"

          # Import RDS instance if it exists
          aws rds describe-db-instances \
            --db-instance-identifier cev-postgres \
            --region us-east-1 > /dev/null 2>&1 && \
            terraform import aws_db_instance.cev_postgres cev-postgres || \
            echo "RDS instance not found, will create"

          # Import Lambda functions if they exist
          aws lambda get-function \
            --function-name cev-api-handler \
            --region us-east-1 > /dev/null 2>&1 && \
            terraform import aws_lambda_function.cev_api cev-api-handler || \
            echo "Lambda cev-api-handler not found, will create"

          aws lambda get-function \
            --function-name cev-status-updater \
            --region us-east-1 > /dev/null 2>&1 && \
            terraform import aws_lambda_function.cev_status_updater \
              cev-status-updater || \
            echo "Lambda cev-status-updater not found, will create"

      - name: Terraform apply or destroy
        run: |
          if [ "${{ github.event.inputs.destroy }}" = "destroy" ]; then
            terraform destroy -auto-approve
          else
            terraform apply -auto-approve
          fi

      - name: Capture outputs
        id: out
        if: github.event.inputs.destroy != 'destroy'
        run: |
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)"       >> $GITHUB_OUTPUT
          echo "rds_sg_id=$(terraform output -raw rds_sg_id)"             >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)"   >> $GITHUB_OUTPUT
          echo "s3_bucket_arn=$(terraform output -raw s3_bucket_arn)"     >> $GITHUB_OUTPUT
          echo "api_url=$(terraform output -raw api_gateway_url)"         >> $GITHUB_OUTPUT

      - run: terraform output
        if: github.event.inputs.destroy != 'destroy'

  # ── Step 3a: Apply schema ──────────────────────────────────────────────────
  apply-schema:
    name: "3a — Apply DB schema"
    runs-on: ubuntu-latest
    needs: api-terraform
    if: github.event.inputs.destroy != 'destroy'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Wait for RDS
        run: |
          echo "Waiting for RDS (up to 15 min on first creation)..."
          aws rds wait db-instance-available \
            --db-instance-identifier cev-postgres --region ${{ env.AWS_REGION }}
          echo "RDS ready"

      - name: Apply schema
        run: |
          PAYLOAD=$(python3 -c "
          import json
          sql = open('api/schema.sql').read()
          print(json.dumps({'action': 'run_schema', 'sql': sql}))
          ")
          aws lambda invoke \
            --function-name cev-status-updater \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            --region ${{ env.AWS_REGION }} \
            /tmp/schema_out.json
          cat /tmp/schema_out.json

  # ── Step 3b: Store password in SSM ────────────────────────────────────────
  store-ssm:
    name: "3b — Store DB password in SSM"
    runs-on: ubuntu-latest
    needs: api-terraform
    if: github.event.inputs.destroy != 'destroy'
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Put DB_PASSWORD in SSM
        run: |
          aws ssm put-parameter \
            --name "/cev/db_password" \
            --value "${{ secrets.DB_PASSWORD }}" \
            --type "SecureString" \
            --overwrite --region ${{ env.AWS_REGION }}
          echo "Stored /cev/db_password"

  # ── Step 4: Compute terraform ──────────────────────────────────────────────
  compute-terraform:
    name: "4 — Compute layer"
    runs-on: ubuntu-latest
    needs: [api-terraform, apply-schema]
    if: github.event.inputs.destroy != 'destroy'
    defaults:
      run:
        working-directory: compute/terraform
    outputs:
      sast_task_arn:    ${{ steps.out.outputs.sast_task_arn }}
      pentest_task_arn: ${{ steps.out.outputs.pentest_task_arn }}
      ecs_cluster_arn:  ${{ steps.out.outputs.ecs_cluster_arn }}
      sast_ecr_url:     ${{ steps.out.outputs.sast_ecr_url }}
      pentest_ecr_url:  ${{ steps.out.outputs.pentest_ecr_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Write api/terraform/terraform.tfvars
        run: |
          cat > terraform.tfvars << EOF
          aws_region        = "us-east-1"
          account_id        = "${{ secrets.AWS_ACCOUNT_ID }}"
          vpc_id            = "${{ secrets.VPC_ID }}"
          private_subnet_a  = "${{ secrets.PRIVATE_SUBNET_A }}"
          private_subnet_b  = "${{ secrets.PRIVATE_SUBNET_B }}"
          public_subnet     = "${{ secrets.PUBLIC_SUBNET }}"
          lambda_role_arn   = "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/LabRole"
          lambda_sg_id      = "${{ secrets.LAMBDA_SG_ID }}"
          rds_sg_id         = "${{ secrets.RDS_SG_ID }}"
          sqs_queue_url     = "${{ secrets.SQS_QUEUE_URL }}"
          sqs_queue_arn     = "${{ secrets.SQS_QUEUE_ARN }}"
          state_machine_arn = "${{ secrets.STATE_MACHINE_ARN }}"
          db_password       = "${{ secrets.DB_PASSWORD }}"
          s3_bucket_name    = "cev-reports-${{ secrets.AWS_ACCOUNT_ID }}"
          EOF

      - name: Debug tfvars
        run: |
          echo "=== tfvars contents (secrets masked) ==="
          grep -v "password\|db_pass" terraform.tfvars
          echo "=== checking lambda_sg_id and rds_sg_id ==="
          grep "lambda_sg_id\|rds_sg_id" terraform.tfvars

      - run: terraform init

      - name: Import existing compute resources
        run: |
          # Import ECR repos
          aws ecr describe-repositories \
            --repository-names compliance-vault-compute-sast-scanner \
            --region us-east-1 > /dev/null 2>&1 && \
            terraform import aws_ecr_repository.sast \
              compliance-vault-compute-sast-scanner || \
            echo "SAST ECR not found, will create"

          aws ecr describe-repositories \
            --repository-names compliance-vault-compute-pentest-scanner \
            --region us-east-1 > /dev/null 2>&1 && \
            terraform import aws_ecr_repository.pentest \
              compliance-vault-compute-pentest-scanner || \
            echo "Pentest ECR not found, will create"

          # Import ECS cluster
          CLUSTER_ARN=$(aws ecs describe-clusters \
            --clusters compliance-vault-compute-cluster \
            --query "clusters[0].clusterArn" \
            --output text 2>/dev/null)
          [ "$CLUSTER_ARN" != "None" ] && [ -n "$CLUSTER_ARN" ] && \
            terraform import aws_ecs_cluster.scanners \
              $CLUSTER_ARN || \
            echo "ECS cluster not found, will create"

          # Import S3 lifecycle config
          aws s3api head-bucket \
            --bucket cev-reports-${{ secrets.AWS_ACCOUNT_ID }} 2>/dev/null && \
            terraform import \
              aws_s3_bucket_lifecycle_configuration.reports \
              cev-reports-${{ secrets.AWS_ACCOUNT_ID }} || \
            echo "S3 lifecycle not found, will create"

      - run: terraform apply -auto-approve

      - name: Capture outputs
        id: out
        run: |
          echo "sast_task_arn=$(terraform output -raw sast_task_definition_arn)"       >> $GITHUB_OUTPUT
          echo "pentest_task_arn=$(terraform output -raw pentest_task_definition_arn)" >> $GITHUB_OUTPUT
          echo "ecs_cluster_arn=$(terraform output -raw ecs_cluster_arn)"              >> $GITHUB_OUTPUT
          echo "sast_ecr_url=$(terraform output -raw sast_ecr_url)"                   >> $GITHUB_OUTPUT
          echo "pentest_ecr_url=$(terraform output -raw pentest_ecr_url)"              >> $GITHUB_OUTPUT

      - run: terraform output

  # ── Step 5: Build and push images ─────────────────────────────────────────
  build-and-push:
    name: "5 — Build and push scanner images"
    runs-on: ubuntu-latest
    needs: compute-terraform
    if: github.event.inputs.destroy != 'destroy'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push SAST
        run: |
          # Use output from compute job, fall back to constructing URL directly
          IMAGE="${{ needs.compute-terraform.outputs.sast_ecr_url }}"
          if [ -z "$IMAGE" ]; then
            IMAGE="126573932591.dkr.ecr.us-east-1.amazonaws.com/compliance-vault-compute-sast-scanner"
            echo "Output was empty — using constructed URL: $IMAGE"
          fi
          echo "Building image: $IMAGE"
          docker build -t $IMAGE:latest ./compute/sast-scanner/
          docker push $IMAGE:latest
          echo "Pushed: $IMAGE:latest"

      - name: Build and push Pentest
        run: |
          IMAGE="${{ needs.compute-terraform.outputs.pentest_ecr_url }}"
          if [ -z "$IMAGE" ]; then
            IMAGE="126573932591.dkr.ecr.us-east-1.amazonaws.com/compliance-vault-compute-pentest-scanner"
            echo "Output was empty — using constructed URL: $IMAGE"
          fi
          echo "Building image: $IMAGE"
          docker build -t $IMAGE:latest ./compute/pentest-scanner/
          docker push $IMAGE:latest
          echo "Pushed: $IMAGE:latest"

      - name: Verify images
        run: |
          aws ecr describe-images \
            --repository-name compliance-vault-compute-sast-scanner \
            --image-ids imageTag=latest \
            --query "imageDetails[0].{Tag:imageTags[0],Pushed:imagePushedAt}" \
            --output table
          aws ecr describe-images \
            --repository-name compliance-vault-compute-pentest-scanner \
            --image-ids imageTag=latest \
            --query "imageDetails[0].{Tag:imageTags[0],Pushed:imagePushedAt}" \
            --output table

  # ── Step 6: Summary ────────────────────────────────────────────────────────
  summary:
    name: "6 — Done"
    runs-on: ubuntu-latest
    needs: [api-terraform, compute-terraform, build-and-push, store-ssm]
    if: github.event.inputs.destroy != 'destroy'
    steps:
      - name: Print summary
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║   COMPLIANCE EVIDENCE VAULT — FULLY DEPLOYED        ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  API URL:      ${{ needs.api-terraform.outputs.api_url }}"
          echo "║  RDS:          ${{ needs.api-terraform.outputs.rds_endpoint }}"
          echo "║  S3 bucket:    ${{ needs.api-terraform.outputs.s3_bucket_name }}"
          echo "║  ECS cluster:  ${{ needs.compute-terraform.outputs.ecs_cluster_arn }}"
          echo "║  SAST task:    ${{ needs.compute-terraform.outputs.sast_task_arn }}"
          echo "║  Pentest task: ${{ needs.compute-terraform.outputs.pentest_task_arn }}"
          echo "╚══════════════════════════════════════════════════════╝"