name: "Full deployment — all infrastructure in one account"

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: "Type 'destroy' to tear down all infrastructure"
        required: false
        default: ""

env:
  AWS_REGION:  us-east-1
  TF_VERSION:  "1.7.0"

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # STEP 1 — Build lambda_function.zip
  # Must run before any Terraform because lambda.tf reads the zip at plan time
  # ══════════════════════════════════════════════════════════════════════════
  build-lambda:
    name: "1 — Build Lambda zip"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and zip
        run: |
          mkdir -p api/lambda/package
          pip install \
            psycopg2-binary==2.9.9 \
            boto3==1.34.0 \
            --target api/lambda/package \
            --quiet
          cp api/lambda/handler.py        api/lambda/package/
          cp api/lambda/status_updater.py api/lambda/package/
          cd api/lambda/package
          zip -r ../lambda_function.zip . -q
          cd ../../..
          echo "Built lambda_function.zip ($(du -sh api/lambda/lambda_function.zip | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: api/lambda/lambda_function.zip
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════════
  # STEP 2 — Shubham's API terraform
  # Creates: RDS, S3, API Gateway, Lambda
  # All values from GitHub Secrets — zero hardcoding
  # ══════════════════════════════════════════════════════════════════════════
  api-terraform:
    name: "2 — API layer (RDS + S3 + API Gateway + Lambda)"
    runs-on: ubuntu-latest
    needs: build-lambda
    defaults:
      run:
        working-directory: api/terraform
    outputs:
      rds_endpoint:   ${{ steps.out.outputs.rds_endpoint }}
      rds_sg_id:      ${{ steps.out.outputs.rds_sg_id }}
      s3_bucket_name: ${{ steps.out.outputs.s3_bucket_name }}
      s3_bucket_arn:  ${{ steps.out.outputs.s3_bucket_arn }}
      api_url:        ${{ steps.out.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download lambda zip
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          path: api/lambda/

      - name: Write api/terraform/terraform.tfvars
        run: |
          cat > terraform.tfvars << EOF
          aws_region       = "us-east-1"
          account_id       = "${{ secrets.AWS_ACCOUNT_ID }}"
          vpc_id           = "${{ secrets.VPC_ID }}"
          private_subnet_a = "${{ secrets.PRIVATE_SUBNET_A }}"
          private_subnet_b = "${{ secrets.PRIVATE_SUBNET_B }}"
          public_subnet    = "${{ secrets.PUBLIC_SUBNET }}"
          lambda_role_arn  = "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/LabRole"
          sqs_queue_url    = "${{ secrets.SQS_QUEUE_URL }}"
          sqs_queue_arn    = "${{ secrets.SQS_QUEUE_ARN }}"
          state_machine_arn = "${{ secrets.STATE_MACHINE_ARN }}"
          db_password      = "${{ secrets.DB_PASSWORD }}"
          EOF

      - run: terraform init

      - name: Terraform apply or destroy
        run: |
          if [ "${{ github.event.inputs.destroy }}" = "destroy" ]; then
            terraform destroy -auto-approve
          else
            terraform apply -auto-approve
          fi

      - name: Capture outputs
        id: out
        if: github.event.inputs.destroy != 'destroy'
        run: |
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)"       >> $GITHUB_OUTPUT
          echo "rds_sg_id=$(terraform output -raw rds_sg_id)"             >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)"   >> $GITHUB_OUTPUT
          echo "s3_bucket_arn=$(terraform output -raw s3_bucket_arn)"     >> $GITHUB_OUTPUT
          echo "api_url=$(terraform output -raw api_gateway_url)"         >> $GITHUB_OUTPUT

      - run: terraform output
        if: github.event.inputs.destroy != 'destroy'

  # ══════════════════════════════════════════════════════════════════════════
  # STEP 3a — Wait for RDS, apply schema
  # ══════════════════════════════════════════════════════════════════════════
  apply-schema:
    name: "3a — Apply database schema"
    runs-on: ubuntu-latest
    needs: api-terraform
    if: github.event.inputs.destroy != 'destroy'

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Wait for RDS to be available
        run: |
          echo "Waiting for RDS (up to 15 min on first creation)..."
          aws rds wait db-instance-available \
            --db-instance-identifier cev-postgres \
            --region ${{ env.AWS_REGION }}
          echo "RDS ready"

      - name: Apply schema.sql via status_updater Lambda
        run: |
          PAYLOAD=$(python3 -c "
          import json
          sql = open('api/schema.sql').read()
          print(json.dumps({'action': 'run_schema', 'sql': sql}))
          ")
          aws lambda invoke \
            --function-name cev-status-updater \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            --region ${{ env.AWS_REGION }} \
            /tmp/schema_out.json
          cat /tmp/schema_out.json

  # ══════════════════════════════════════════════════════════════════════════
  # STEP 3b — Store DB_PASSWORD in SSM (runs in parallel with 3a)
  # Ishit's orchestrator Lambda reads from /cev/db_password at runtime
  # so the password never travels through environment variables
  # ══════════════════════════════════════════════════════════════════════════
  store-ssm:
    name: "3b — Store DB password in SSM"
    runs-on: ubuntu-latest
    needs: api-terraform
    if: github.event.inputs.destroy != 'destroy'

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Write DB_PASSWORD to SSM Parameter Store
        run: |
          aws ssm put-parameter \
            --name "/cev/db_password" \
            --value "${{ secrets.DB_PASSWORD }}" \
            --type "SecureString" \
            --overwrite \
            --region ${{ env.AWS_REGION }}
          echo "Stored /cev/db_password as SecureString"

  # ══════════════════════════════════════════════════════════════════════════
  # STEP 4 — Ankita's compute terraform
  # rds_endpoint flows in from Step 2 outputs — no manual copy
  # s3_bucket_name flows in from Step 2 outputs — no manual copy
  # ══════════════════════════════════════════════════════════════════════════
  compute-terraform:
    name: "4 — Compute layer (ECR + ECS + task definitions)"
    runs-on: ubuntu-latest
    needs: [api-terraform, apply-schema]
    if: github.event.inputs.destroy != 'destroy'
    defaults:
      run:
        working-directory: compute/terraform
    outputs:
      sast_task_arn:    ${{ steps.out.outputs.sast_task_arn }}
      pentest_task_arn: ${{ steps.out.outputs.pentest_task_arn }}
      ecs_cluster_arn:  ${{ steps.out.outputs.ecs_cluster_arn }}
      sast_ecr_url:     ${{ steps.out.outputs.sast_ecr_url }}
      pentest_ecr_url:  ${{ steps.out.outputs.pentest_ecr_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Write compute/terraform/terraform.tfvars
        run: |
          cat > terraform.tfvars << EOF
          aws_region                = "us-east-1"
          account_id                = "${{ secrets.AWS_ACCOUNT_ID }}"
          project                   = "compliance-vault"
          ecr_image_tag             = "latest"
          vpc_id                    = "${{ secrets.VPC_ID }}"
          private_subnet_ids        = ["${{ secrets.PRIVATE_SUBNET_A }}", "${{ secrets.PRIVATE_SUBNET_B }}"]
          rds_security_group_id     = "${{ needs.api-terraform.outputs.rds_sg_id }}"
          fargate_security_group_id = "${{ secrets.FARGATE_SG_ID }}"
          report_bucket_name        = "${{ needs.api-terraform.outputs.s3_bucket_name }}"
          db_host                   = "${{ needs.api-terraform.outputs.rds_endpoint }}"
          db_name                   = "compliancevault"
          db_user                   = "cevadmin"
          EOF

      - run: terraform init
      - run: terraform apply -auto-approve

      - name: Capture outputs
        id: out
        run: |
          echo "sast_task_arn=$(terraform output -raw sast_task_definition_arn)"       >> $GITHUB_OUTPUT
          echo "pentest_task_arn=$(terraform output -raw pentest_task_definition_arn)" >> $GITHUB_OUTPUT
          echo "ecs_cluster_arn=$(terraform output -raw ecs_cluster_arn)"              >> $GITHUB_OUTPUT
          echo "sast_ecr_url=$(terraform output -raw sast_ecr_url)"                   >> $GITHUB_OUTPUT
          echo "pentest_ecr_url=$(terraform output -raw pentest_ecr_url)"              >> $GITHUB_OUTPUT

      - run: terraform output

  # ══════════════════════════════════════════════════════════════════════════
  # STEP 5 — Build and push Docker images
  # ECR repos exist now (Step 4 created them)
  # ══════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: "5 — Build and push scanner images to ECR"
    runs-on: ubuntu-latest
    needs: compute-terraform
    if: github.event.inputs.destroy != 'destroy'

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push SAST image
        run: |
          IMAGE=${{ needs.compute-terraform.outputs.sast_ecr_url }}
          docker build -t $IMAGE:latest ./compute/sast-scanner/
          docker push $IMAGE:latest
          echo "Pushed: $IMAGE:latest"

      - name: Build and push Pentest image
        run: |
          IMAGE=${{ needs.compute-terraform.outputs.pentest_ecr_url }}
          docker build -t $IMAGE:latest ./compute/pentest-scanner/
          docker push $IMAGE:latest
          echo "Pushed: $IMAGE:latest"

      - name: Verify both images in ECR
        run: |
          for repo in \
            compliance-vault-compute-sast-scanner \
            compliance-vault-compute-pentest-scanner; do
            echo "=== $repo ==="
            aws ecr describe-images \
              --repository-name $repo \
              --image-ids imageTag=latest \
              --query "imageDetails[0].{Tag:imageTags[0],Pushed:imagePushedAt,Bytes:imageSizeInBytes}" \
              --output table
          done

  # ══════════════════════════════════════════════════════════════════════════
  # STEP 6 — Final summary
  # ══════════════════════════════════════════════════════════════════════════
  summary:
    name: "6 — Deployment summary"
    runs-on: ubuntu-latest
    needs: [api-terraform, compute-terraform, build-and-push, store-ssm]
    if: github.event.inputs.destroy != 'destroy'

    steps:
      - name: Print full summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║       COMPLIANCE EVIDENCE VAULT — FULLY DEPLOYED                ║"
          echo "╠══════════════════════════════════════════════════════════════════╣"
          echo "║  API URL:       ${{ needs.api-terraform.outputs.api_url }}"
          echo "║  RDS endpoint:  ${{ needs.api-terraform.outputs.rds_endpoint }}"
          echo "║  S3 bucket:     ${{ needs.api-terraform.outputs.s3_bucket_name }}"
          echo "║  ECS cluster:   ${{ needs.compute-terraform.outputs.ecs_cluster_arn }}"
          echo "║  SAST task:     ${{ needs.compute-terraform.outputs.sast_task_arn }}"
          echo "║  Pentest task:  ${{ needs.compute-terraform.outputs.pentest_task_arn }}"
          echo "║  DB password:   in SSM at /cev/db_password (SecureString)"
          echo "╠══════════════════════════════════════════════════════════════════╣"
          echo "║  ACTION REQUIRED — send these to Ishit:                         ║"
          echo "║  SAST task def ARN:    ${{ needs.compute-terraform.outputs.sast_task_arn }}"
          echo "║  Pentest task def ARN: ${{ needs.compute-terraform.outputs.pentest_task_arn }}"
          echo "║  ECS cluster ARN:      ${{ needs.compute-terraform.outputs.ecs_cluster_arn }}"
          echo "╚══════════════════════════════════════════════════════════════════╝"